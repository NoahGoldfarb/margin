<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Margin Pad</title>
  <link rel="stylesheet" href="vendor/katex.min.css">
  <script src="vendor/katex.min.js" defer></script>
  <!--
    The drawing pad: Margin opens this on the iPad (Sidecar) and whatever the
    Pencil draws lands in the note, as a figure at the caret. The page is 1000
    units wide — the full width of the note or of \columnwidth — and endless
    downwards; a figure is saved cropped to the height it uses, as plain SVG
    that Inkscape opens like any of its own files.
  -->
  <style>
    :root {
      --bar: 64px;
      --ink: #1d2027;
      --dim: #7b818c;
      --line: #d9dbe0;
      --face: #f5f5f3;
      --on: #1d2027;
      --accent: #2F4CDB;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: var(--ink);
      font: 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #bar {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--bar);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      background: var(--face);
      border-bottom: 1px solid var(--line);
      z-index: 3;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #bar::-webkit-scrollbar {
      display: none
    }

    #bar .sep {
      flex: none;
      width: 1px;
      align-self: stretch;
      margin: 12px 3px;
      background: var(--line)
    }

    #bar .grow {
      flex: 1;
      min-width: 4px
    }

    #bar button {
      flex: none;
      height: 50px;
      min-width: 50px;
      padding: 0 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 10.5px;
      cursor: pointer;
    }

    #bar button svg {
      width: 28px;
      height: 18px;
      overflow: visible
    }

    #bar button:disabled {
      opacity: .35
    }

    #bar button.on {
      background: var(--on);
      border-color: var(--on);
      color: #fff
    }

    #bar button.on svg * {
      stroke: #fff
    }

    #bar button.on svg text {
      fill: #fff
    }

    #bar button.on svg .fillable * {
      fill: #fff;
      stroke: none
    }

    /* the colours: four round swatches in a square, the one in use ringed */
    #swatches {
      flex: none;
      display: grid;
      grid-template-columns: 22px 22px;
      gap: 5px;
      padding: 0 3px
    }

    #bar button.swatch {
      min-width: 0;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px var(--line);
    }

    #bar button.swatch.on {
      box-shadow: 0 0 0 2px var(--ink)
    }

    /* $…$ labels typeset over the drawing; the SVG text stays for the file */
    #view text[data-math] {
      fill-opacity: 0
    }

    /* a label being retyped makes way for the copy in the works */
    #view text[data-editing] {
      visibility: hidden
    }

    #labels {
      position: fixed;
      inset: var(--bar) 0 0 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* only the label itself: KaTeX's own spans must stay where KaTeX puts them */
    #labels>span {
      position: absolute;
      transform: translateY(-78%);
      line-height: 1;
      white-space: nowrap;
      font-family: KaTeX_Main, "Times New Roman", serif
    }

    #stage {
      position: fixed;
      inset: var(--bar) 0 0 0;
      cursor: crosshair;
    }

    #stage.erase {
      cursor: cell
    }

    #stage.text {
      cursor: text
    }

    #stage.select {
      cursor: default
    }

    #view {
      display: block;
      width: 100%;
      height: 100%
    }

    #ink {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      will-change: transform
    }

    /* what the pad draws into, out of the way at the bottom */
    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      max-width: calc(100% - 190px);
      padding: 6px 12px;
      border-radius: 16px;
      background: rgba(245, 245, 243, .92);
      border: 1px solid var(--line);
      color: var(--dim);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 2;
    }

    /* zoom, for the Pencil too: − 100% + — the percentage goes back to the whole width */
    #zoom {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: flex;
      align-items: center;
      border-radius: 16px;
      background: rgba(245, 245, 243, .92);
      border: 1px solid var(--line);
      z-index: 2;
    }

    #zoom button {
      height: 32px;
      min-width: 36px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    #zoom #zoom-level {
      min-width: 56px;
      font-size: 13px;
      color: var(--dim);
      font-variant-numeric: tabular-nums
    }

    #zoom.zoomed #zoom-level {
      color: var(--accent);
      font-weight: 600
    }

    #status b {
      color: var(--ink);
      font-weight: 600
    }

    /* nothing to draw into yet: say so instead of swallowing strokes */
    #veil {
      position: fixed;
      inset: var(--bar) 0 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .82);
      color: var(--dim);
      font-size: 20px;
      text-align: center;
      padding: 30px;
      z-index: 2;
    }

    #veil.hidden,
    #selmenu.hidden {
      display: none
    }

    #veil.flash {
      color: var(--ink)
    }

    #caret {
      fill: var(--accent);
      animation: blink 1.1s step-end infinite
    }

    @keyframes blink {
      50% {
        fill-opacity: 0
      }
    }

    /* what to do with the selection, right above it */
    #selmenu {
      position: fixed;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--ink);
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
      z-index: 2;
      transform: translate(-50%, -100%);
    }

    #selmenu button {
      height: 40px;
      padding: 0 14px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    #selmenu button:active {
      background: rgba(255, 255, 255, .15)
    }

    .sel-box {
      fill: rgba(47, 76, 219, .05);
      stroke: var(--accent);
      stroke-width: 1.5;
      stroke-dasharray: 6 5;
      vector-effect: non-scaling-stroke
    }

    .lasso {
      fill: rgba(47, 76, 219, .06);
      stroke: var(--accent);
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
      vector-effect: non-scaling-stroke
    }

    /* a selected shape's handles: its centre, corners, a point on a circle */
    .handle {
      fill: #fff;
      stroke: var(--accent);
      stroke-width: 2;
      vector-effect: non-scaling-stroke
    }

    .handle.center {
      fill: var(--accent)
    }

    .handle-guide {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.2;
      stroke-dasharray: 4 4;
      vector-effect: non-scaling-stroke
    }

    .snap-mark {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      vector-effect: non-scaling-stroke
    }
  </style>
</head>

<body>
  <div id="bar">
    <button id="undo" title="Undo (⌘Z on the Mac)" disabled>
      <svg viewBox="0 0 30 18"><path d="M9 4 L4 9 L9 14 M4 9 H19 a6 6 0 0 1 0 12" fill="none" stroke="#1d2027" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 -2)"/></svg>Undo</button>
    <button id="redo" title="Redo" disabled>
      <svg viewBox="0 0 30 18"><path d="M21 4 L26 9 L21 14 M26 9 H11 a6 6 0 0 0 0 12" fill="none" stroke="#1d2027" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 -2)"/></svg>Redo</button>
    <span class="sep"></span>
    <button data-tool="pen" title="Draw — hold still at the end of a stroke for a clean shape">
      <svg viewBox="0 0 30 18"><path d="M6 16 L8 11 L20 1 L24 5 L12 15 Z M8 11 L12 15" fill="none" stroke="#1d2027" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>Pen</button>
    <button data-tool="select" title="Tap a stroke or draw around several — then drag them, restyle, duplicate or delete">
      <svg viewBox="0 0 30 18"><path d="M9 1 L9 15 L13 11 L16 17 L18.5 16 L15.5 10 L21 10 Z" fill="none" stroke="#1d2027" stroke-width="1.8" stroke-linejoin="round"/></svg>Select</button>
    <button data-tool="text" title="Tap where a label goes, then type it on the Mac — drag a label to move it">
      <svg viewBox="0 0 30 18"><text x="15" y="15" text-anchor="middle" font-family="serif" font-style="italic" font-size="17" fill="#1d2027" stroke="none">A</text></svg>Text</button>
    <button data-tool="erase" title="Eraser: strike through whole strokes">
      <svg viewBox="0 0 30 18"><path d="M8 15 L4 11 L13 2 L21 10 L16 15 Z M10 7 L17 14 M8 15 H26" fill="none" stroke="#1d2027" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>Eraser</button>
    <button data-tool="axes" title="Axes: press at the origin and drag — one direction only gives a number line">
      <svg viewBox="0 0 30 18"><path d="M8 17 V2 M5 5 L8 1 L11 5 M6 14 H27 M23 11 L27 14 L23 17" fill="none" stroke="#1d2027" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>Axes</button>
    <span class="sep"></span>
    <button data-style="thick" title="Thick lines">
      <svg viewBox="0 0 30 18"><path d="M3 9 H27" stroke="#1d2027" stroke-width="5" stroke-linecap="round"/></svg>Thick</button>
    <button data-style="dashed" title="Dashed lines">
      <svg viewBox="0 0 30 18"><path d="M3 9 H27" stroke="#1d2027" stroke-width="2.4" stroke-dasharray="6 4"/></svg>Dashed</button>
    <button data-style="dotted" title="Dotted lines">
      <svg viewBox="0 0 30 18"><path d="M4 9 H27" stroke="#1d2027" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.01 5.5"/></svg>Dotted</button>
    <button data-style="arrow" title="Arrow: none → at the end → at both ends">
      <svg viewBox="0 0 30 18"></svg><span>Arrow</span></button>
    <button data-style="fill" title="Fill closed shapes in their colour, see-through — overlaps come out darker → hatched → none">
      <svg viewBox="0 0 30 18"></svg><span>Fill</span></button>
    <span class="sep"></span>
    <span id="swatches"></span>
    <span class="sep"></span>
    <button data-style="grid" title="Snap shapes to the dot grid">
      <svg viewBox="0 0 30 18"><g fill="#1d2027" stroke="none"><circle cx="6" cy="3" r="1.6"/><circle cx="15" cy="3" r="1.6"/><circle cx="24" cy="3" r="1.6"/><circle cx="6" cy="15" r="1.6"/><circle cx="24" cy="15" r="1.6"/></g><path d="M6 15 L15 3 L24 15" fill="none" stroke="#1d2027" stroke-width="1.8" stroke-linejoin="round"/></svg>Grid</button>
    <span class="grow"></span>
    <button id="copyprev" title="Start the next figure as a copy of the previous one">
      <svg viewBox="0 0 30 18"><rect x="5" y="1" width="13" height="11" rx="2" fill="none" stroke="#1d2027" stroke-width="2"/><rect x="11" y="6" width="13" height="11" rx="2" fill="#fff" stroke="#1d2027" stroke-width="2"/></svg>Copy prev.</button>
    <button id="newfig" title="Start a new figure below this one">
      <svg viewBox="0 0 30 18"><path d="M15 2 V16 M8 9 H22" stroke="#1d2027" stroke-width="2.4" stroke-linecap="round"/></svg>New</button>
  </div>

  <div id="stage">
    <svg id="view" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs">
        <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse">
          <circle cx="12.5" cy="12.5" r="1.1" fill="#d4d6db" />
        </pattern>
      </defs>
      <rect id="grid" x="0" y="-100000" width="1000" height="200000" fill="url(#dots)" />
      <g id="content"></g>
      <g id="typing"></g>
      <g id="ui"></g>
    </svg>
    <!-- the stroke being drawn, on a layer of its own: drawing it repaints nothing underneath -->
    <svg id="ink" xmlns="http://www.w3.org/2000/svg">
      <g id="live"></g>
    </svg>
  </div>
  <div id="labels"></div>
  <div id="status">Starting…</div>
  <div id="zoom">
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="zoom-level" title="Back to the whole width">100%</button>
    <button id="zoom-in" title="Zoom in — or pinch with two fingers">+</button>
  </div>
  <div id="selmenu" class="hidden">
    <button id="sel-dup">Duplicate</button>
    <button id="sel-del">Delete</button>
  </div>
  <div id="veil" class="hidden"></div>

  <script>
    'use strict';
    const SVGNS = 'http://www.w3.org/2000/svg';
    const W = 1000;                    // page width in units; the note's full width
    const GRAY = '#d9d9d9';            // the old opaque fill, still read in older figures
    const FILL_ALPHA = 0.15;           // a fill is its shape's colour, see-through: overlaps come out darker
    const TEXT_SIZE = 28;              // ≈ 10pt once 1000 units become \columnwidth
    const HOLD_MS = 450;               // keep the Pencil still this long to snap a shape
    const GRID = 25;                   // the dot grid; dots sit at 12.5 + 25k
    const SNAP = 14;                   // ends this close to another end, corner or point join it
    const COLORS = [
      { name: 'black', hex: '#000000' },
      { name: 'blue', hex: '#1f5ccc' },
      { name: 'red', hex: '#d1352b' },
      { name: 'green', hex: '#23884a' }
    ];

    const colorName = hex => {
      const c = COLORS.find(c => c.hex === String(hex).toLowerCase()) || COLORS[0];
      return c.name === 'black' ? '' : '-' + c.name;
    };

    // Arrow heads, scaled with the stroke, one pair per colour: "arrow" (the
    // end) and "arrow-start" — LaTeX's curved head, not a plain triangle.
    // Inkscape keeps markers as they are.
    const markerId = (hex, start) => 'arrow' + (start ? '-start' : '') + colorName(hex);
    const HEAD = 'M 1.4,0 C 0.2,0.4 -1.6,1.2 -3.6,2.5 C -2.9,1.1 -2.9,-1.1 -3.6,-2.5 C -1.6,-1.2 0.2,-0.4 1.4,0 Z';
    const mirror = d => d.replace(/(-?[\d.]+),/g, (_, x) => String(-x) + ',');
    // Hatching, the other fill: thin lines at 45° in the shape's colour, see-through as well
    const hatchId = hex => 'hatch' + colorName(hex);
    const DEFS = COLORS.map(c =>
      `<marker id="${markerId(c.hex)}" orient="auto" markerUnits="strokeWidth" style="overflow:visible">` +
      `<path d="${HEAD}" style="fill:${c.hex};stroke:none"/></marker>` +
      `<marker id="${markerId(c.hex, true)}" orient="auto" markerUnits="strokeWidth" style="overflow:visible">` +
      `<path d="${mirror(HEAD)}" style="fill:${c.hex};stroke:none"/></marker>` +
      `<pattern id="${hatchId(c.hex)}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">` +
      `<path d="M 0,4.5 H 9" style="fill:none;stroke:${c.hex};stroke-width:1.5;stroke-opacity:0.55"/></pattern>`).join('');
    // ours, always at hand: a file's own copies of them are not kept twice
    const OUR_DEFS = new Set(COLORS.flatMap(c => [markerId(c.hex), markerId(c.hex, true), hatchId(c.hex)]));

    // Inkscape's lock: a GeoGebra picture under the drawing stays where it is
    const SODIPODI = 'http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd';
    const isLocked = n => n.getAttributeNS(SODIPODI, 'insensitive') === 'true';

    const $ = s => document.querySelector(s);
    const view = $('#view'), ink = $('#ink'), content = $('#content'), live = $('#live'), ui = $('#ui'), stage = $('#stage');
    const typingLayer = $('#typing'); // the label being typed: strokes drawn meanwhile leave it alone
    view.querySelector('defs').insertAdjacentHTML('beforeend', DEFS);

    // the way to the Mac: Electron's preload, or nothing yet (page opened on its own)
    const bridge = window.padBridge || { send() { }, on() { } };
    const send = msg => bridge.send(msg);

    // arrow: 0 none, 1 at the end, 2 at both ends; fill: 0 none, 1 see-through colour, 2 hatched
    const style = { thick: false, dashed: false, dotted: false, arrow: 0, fill: 0, grid: false, color: '#000000' };
    let tool = 'pen';                  // 'pen' | 'select' | 'erase' | 'text' | 'axes'
    let target = { key: null, kind: 'none', label: '' };
    let scrollY = 0;                   // page units at the top of the stage
    let scrollX = 0;                   // …and at its left, once zoomed in
    let zoom = 1;                      // 1: the page's full width across the stage
    const MAX_ZOOM = 8;
    let extraDefs = [];                // <defs> children a loaded file brought along (Inkscape's)
    const histories = new Map();       // figure key -> { undo: [snapshots], redo: [] }
    let selection = [];                // selected items (Select tool)

    /* ---------------------------------------------------------------- *
     *  view: 1000 units across the stage, or fewer zoomed in — two
     *  fingers move it, pinching zooms; never while the Pencil is down
     * ---------------------------------------------------------------- */
    const scale = () => stage.clientWidth / W * zoom;
    function layout() {
      const h = stage.clientHeight / scale();
      view.setAttribute('viewBox', `${scrollX} ${scrollY} ${W / zoom} ${h}`);
      ink.setAttribute('viewBox', view.getAttribute('viewBox'));
      $('#zoom-level').textContent = Math.round(zoom * 100) + '%';
      $('#dots circle').setAttribute('r', 1.1 / zoom); // grid dots stay small however close you are
      $('#zoom').classList.toggle('zoomed', zoom > 1);
      paintSelection();
      paintLabels();
    }
    function clampView() {
      scrollX = Math.max(0, Math.min(W - W / zoom, scrollX));
      scrollY = Math.max(-3000, Math.min(30000, scrollY));
    }
    function panBy(dx, dy) { scrollX += dx; scrollY += dy; clampView(); layout(); }
    // zoom by f, the spot under (cx, cy) staying where it is
    function zoomAt(cx, cy, f) {
      const p = clientToPage(cx, cy), r = stage.getBoundingClientRect();
      zoom = Math.max(1, Math.min(MAX_ZOOM, zoom * f));
      scrollX = p.x - (cx - r.left) / scale();
      scrollY = p.y - (cy - r.top) / scale();
      clampView(); layout();
    }
    const busy = () => !!(stroke || erasing || picking || axes || dragging); // the Pencil is at work

    // Labels with $…$ typeset by KaTeX, laid over the drawing where the text
    // sits — the one being typed too, so it looks while typing as it will
    const typeset = new Map(); // label text -> KaTeX's HTML; scrolling repaints, it need not re-typeset
    const escHtml = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    function labelHtml(text, typing) {
      const key = (typing ? '1' : '0') + text;
      let html = typeset.get(key);
      if (html === undefined) {
        html = text.split(/(\$[^$]+\$)/).map(part => {
          if (!/^\$[^$]+\$$/.test(part)) return escHtml(part);
          // half-typed math (\fra…) shows as typed, not as a red error
          try { return katex.renderToString(part.slice(1, -1), { throwOnError: typing }); }
          catch { return escHtml(part); }
        }).join('');
        if (typeset.size > 500) typeset.clear();
        typeset.set(key, html);
      }
      return html;
    }

    function paintLabels() {
      const box = $('#labels');
      box.replaceChildren();
      const typing = label && label.node;
      if (typing) label.span = null;
      if (!window.katex) { if (typing) placeCaret(); return; }
      const top = stage.getBoundingClientRect().top;
      for (const t of [...content.querySelectorAll('text'), ...(typing ? [typing] : [])]) {
        const text = t.textContent;
        t._span = null;
        if (!text.includes('$') || t.closest('[transform]') || t.hasAttribute('data-editing')) { t.removeAttribute('data-math'); continue; }
        t.setAttribute('data-math', '');
        const at = pageToClient({ x: +t.getAttribute('x'), y: +t.getAttribute('y') });
        const size = parseFloat((/font-size:\s*([\d.]+)/.exec(t.getAttribute('style') || '') || [])[1]) || TEXT_SIZE;
        const span = document.createElement('span');
        span.style.left = at.x + 'px';
        span.style.top = at.y - top + 'px';
        span.style.fontSize = size * scale() * 0.92 + 'px';
        span.style.color = (/fill:\s*(#[0-9a-f]{3,6})/i.exec(t.getAttribute('style') || '') || [])[1] || '#000';
        span.innerHTML = labelHtml(text, t === typing);
        box.appendChild(span);
        t._span = span;
        if (t === typing) label.span = span;
      }
      if (typing) placeCaret();
    }
    window.addEventListener('load', () => paintLabels());
    // KaTeX's fonts arrive on first use: the caret moves to where the label really ends
    document.fonts.addEventListener('loadingdone', () => paintLabels());
    window.addEventListener('resize', layout);
    // two fingers on Sidecar arrive as a trackpad: scrolling pans, a pinch is a wheel with ctrlKey
    stage.addEventListener('wheel', e => {
      e.preventDefault();
      if (busy()) return;
      if (e.ctrlKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      else panBy(e.deltaX / scale(), e.deltaY / scale());
    }, { passive: false });
    // a pinch over the toolbar zooms nothing — not the whole window either
    window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

    // fingers on a touch screen: one drags the page, two pinch and drag it
    const fingers = new Map();
    stage.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'touch') return;
      fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { stage.setPointerCapture(e.pointerId); } catch { }
    });
    stage.addEventListener('pointermove', e => {
      const f = fingers.get(e.pointerId);
      if (!f) return;
      const two = () => [...fingers.values()].slice(0, 2);
      const before = two().map(q => ({ ...q }));
      f.x = e.clientX; f.y = e.clientY;
      const after = two();
      if (busy() || !before.some((q, i) => q.x !== after[i].x || q.y !== after[i].y)) return;
      const mid = q => q.length > 1 ? { x: (q[0].x + q[1].x) / 2, y: (q[0].y + q[1].y) / 2 } : q[0];
      const m0 = mid(before), m1 = mid(after);
      if (after.length > 1) zoomAt(m0.x, m0.y, dist(after[0], after[1]) / Math.max(1, dist(before[0], before[1])));
      panBy((m0.x - m1.x) / scale(), (m0.y - m1.y) / scale());
    });
    for (const type of ['pointerup', 'pointercancel']) stage.addEventListener(type, e => fingers.delete(e.pointerId));

    const clientToPage = (cx, cy) => {
      const r = stage.getBoundingClientRect();
      return { x: (cx - r.left) / scale() + scrollX, y: (cy - r.top) / scale() + scrollY };
    };
    const pageToClient = p => {
      const r = stage.getBoundingClientRect();
      return { x: r.left + (p.x - scrollX) * scale(), y: r.top + (p.y - scrollY) * scale() };
    };
    const toPage = e => clientToPage(e.clientX, e.clientY);
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const r1 = v => Math.round(v * 10) / 10;

    // a point in an element's own coordinates, on the page
    function localToPage(node, x, y) {
      const m = node.getScreenCTM();
      if (!m) return { x, y };
      const p = new DOMPoint(x, y).matrixTransform(m);
      return clientToPage(p.x, p.y);
    }

    // an element's box on the page
    function pageBox(node) {
      const r = node.getBoundingClientRect();
      const a = clientToPage(r.left, r.top), b = clientToPage(r.right, r.bottom);
      return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y };
    }

    /* ---------------------------------------------------------------- *
     *  styles — Castel's table, cut down to the buttons that matter
     * ---------------------------------------------------------------- */
    const width = () => style.thick ? 5 : 2.5;
    const dashFor = w => style.dashed ? `${4 * w},${3 * w}` : style.dotted ? `0.01,${2.6 * w}` : null;

    // A closed shape's fill: 0 none, 1 its colour see-through (overlaps get
    // darker), 2 hatched in its colour
    function setFill(st, kind, c) {
      st.delete('fill-opacity');
      if (kind === 2) st.set('fill', `url(#${hatchId(c)})`);
      else if (kind === 1) { st.set('fill', c); st.set('fill-opacity', String(FILL_ALPHA)); }
      else st.set('fill', 'none');
    }
    const fillKind = st => /url\(#hatch/.test(st.get('fill') || '') ? 2 : isFilled(st) ? 1 : 0;
    // an outline with something inside (a dot is all fill, a label is text)
    const isFilled = st => (st.get('fill') || 'none') !== 'none' && (st.get('stroke') || 'none') !== 'none';

    function styleText({ closed = false, open = false, dot = false } = {}) {
      const w = width(), c = style.color;
      if (dot) return `fill:${c};stroke:none`;
      const fill = new Map();
      setFill(fill, open ? 0 : style.fill, c);
      const parts = [
        ...[...fill].map(([k, v]) => k + ':' + v),
        `stroke:${c}`, `stroke-width:${w}`, 'stroke-linecap:round', 'stroke-linejoin:round'
      ];
      const dash = dashFor(w);
      if (dash) parts.push(`stroke-dasharray:${dash}`);
      if (style.arrow && !closed) {
        parts.push(`marker-end:url(#${markerId(c)})`);
        if (style.arrow === 2) parts.push(`marker-start:url(#${markerId(c, true)})`);
      }
      return parts.join(';');
    }

    function el(name, attrs) {
      const node = document.createElementNS(SVGNS, name);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      return node;
    }

    // a style="" attribute as an ordered map, and back
    function readStyle(node) {
      const map = new Map();
      for (const part of (node.getAttribute('style') || '').split(';')) {
        const i = part.indexOf(':');
        if (i > 0) map.set(part.slice(0, i).trim(), part.slice(i + 1).trim());
      }
      return map;
    }
    function writeStyle(node, map) {
      node.setAttribute('style', [...map].map(([k, v]) => k + ':' + v).join(';'));
    }

    /* ---------------------------------------------------------------- *
     *  snapping: ends join ends, corners and points; shapes to the grid
     * ---------------------------------------------------------------- */
    // Worked out when first needed and kept until the drawing changes — walking
    // every stroke at each touch of the Pencil made writing lag once a figure grew
    let snapCache = null;
    const snaps = () => snapCache || (snapCache = snapTargets());
    function drawingChanged() {
      snapCache = null;
      const idle = window.requestIdleCallback || (f => setTimeout(f, 50));
      idle(() => { if (!stroke) snaps(); }); // ready before the Pencil comes down again
    }

    // every end, corner and point already on the page
    function snapTargets(skip = null) {
      const out = [];
      const add = (n, x, y) => out.push(localToPage(n, x, y));
      const walk = n => {
        switch (n.localName) {
          case 'g': for (const c of n.children) walk(c); break;
          case 'path': {
            const d = n.getAttribute('d') || '';
            if (/^[MLZ\d\s.,-]+$/.test(d)) {
              const nums = d.match(/-?\d*\.?\d+/g).map(Number);
              for (let i = 0; i + 1 < nums.length; i += 2) add(n, nums[i], nums[i + 1]);
            } else {
              try {
                const len = n.getTotalLength(), a = n.getPointAtLength(0), b = n.getPointAtLength(len);
                add(n, a.x, a.y); add(n, b.x, b.y);
              } catch { /* not a drawable path */ }
            }
            break;
          }
          case 'circle': case 'ellipse': add(n, +n.getAttribute('cx'), +n.getAttribute('cy')); break;
          case 'rect': {
            const x = +n.getAttribute('x'), y = +n.getAttribute('y'), w = +n.getAttribute('width'), h = +n.getAttribute('height');
            add(n, x, y); add(n, x + w, y); add(n, x, y + h); add(n, x + w, y + h);
            break;
          }
          case 'line':
            add(n, +n.getAttribute('x1'), +n.getAttribute('y1')); add(n, +n.getAttribute('x2'), +n.getAttribute('y2'));
            break;
        }
      };
      for (const n of content.children) if (n !== skip) walk(n);
      return out;
    }

    function endSnap(p) {
      let best = null, d = SNAP / zoom; // as far on screen at any zoom
      for (const q of snaps()) { const e = dist(p, q); if (e < d) { d = e; best = q; } }
      return best ? { x: best.x, y: best.y, snapped: true } : null;
    }
    const gridSnap = p => ({ x: Math.round((p.x - 12.5) / GRID) * GRID + 12.5, y: Math.round((p.y - 12.5) / GRID) * GRID + 12.5 });
    // an end of a straight piece: another end first, else the grid when it is on
    const snapPt = p => endSnap(p) || (style.grid ? gridSnap(p) : p);

    function showSnapMarks(points) {
      ui.querySelectorAll('.snap-mark').forEach(n => n.remove());
      for (const p of points) if (p && p.snapped) ui.appendChild(el('circle', { class: 'snap-mark', cx: p.x, cy: p.y, r: 7 / zoom }));
    }

    /* ---------------------------------------------------------------- *
     *  shape recognition — hold the Pencil at the end of a stroke
     * ---------------------------------------------------------------- */
    function pathLength(pts) {
      let n = 0;
      for (let i = 1; i < pts.length; i++) n += dist(pts[i - 1], pts[i]);
      return n;
    }

    function segDist(p, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y, len = dx * dx + dy * dy;
      if (!len) return dist(p, a);
      const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len));
      return Math.hypot(p.x - a.x - t * dx, p.y - a.y - t * dy);
    }

    // Ramer–Douglas–Peucker: the corners of a stroke
    function simplify(pts, eps) {
      if (pts.length < 3) return pts.slice();
      let far = 0, at = 0;
      for (let i = 1; i < pts.length - 1; i++) {
        const d = segDist(pts[i], pts[0], pts[pts.length - 1]);
        if (d > far) { far = d; at = i; }
      }
      if (far <= eps) return [pts[0], pts[pts.length - 1]];
      return simplify(pts.slice(0, at + 1), eps).slice(0, -1).concat(simplify(pts.slice(at), eps));
    }

    // a straight line snaps to 0°, 45°, 90° … when it is close
    function snapAngle(a, b) {
      const ang = Math.atan2(b.y - a.y, b.x - a.x), len = dist(a, b);
      const step = Math.PI / 4, near = Math.round(ang / step) * step;
      if (Math.abs(ang - near) > 0.12) return b;
      return { x: a.x + Math.cos(near) * len, y: a.y + Math.sin(near) * len };
    }

    // the far end of a line: another end, else the angle and the grid
    function lineEnd(a, p) {
      const e = endSnap(p);
      if (e) return e;
      const b = snapAngle(a, p);
      return style.grid ? gridSnap(b) : b;
    }

    // How much of a stroke's turning happens at the given corners: near 1 for
    // straight pieces meeting at corners (a hand-drawn V, Z or triangle scores
    // 0.8–0.95), lower for a curve, which turns all along (0.3–0.65).
    // Measured on screen, the wobble smoothed out and its little turns ignored.
    const ANGULAR = 0.75;
    function cornerShare(pts, corners) {
      const k = zoom, span = 6, p = relax(resample(pts.map(q => ({ x: q.x * k, y: q.y * k }))), 3);
      const cs = corners.map(c => ({ x: c.x * k, y: c.y * k }));
      let total = 0, near = 0;
      for (let i = span; i < p.length - span; i++) {
        const a = Math.max(0, turn(p[i - span], p[i], p[i + span]) - 0.1);
        total += a;
        if (cs.some(c => dist(p[i], c) < 14 + 2 * span)) near += a;
      }
      return total ? near / total : 1;
    }

    function recognize(pts) {
      const u = 1 / zoom; // sizes as they look on screen, at any zoom
      const len = pathLength(pts);
      if (len < 20 * u) return null;
      const a = pts[0], b = pts[pts.length - 1], chord = dist(a, b);
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of pts) {
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      }
      const w = maxX - minX, h = maxY - minY, diag = Math.hypot(w, h);

      // a line: nothing strays far from the chord
      let dev = 0;
      for (const p of pts) dev = Math.max(dev, segDist(p, a, b));
      if (chord > 15 * u && dev < Math.max(5 * u, chord * 0.07)) {
        const a2 = snapPt(a);
        return { type: 'line', a: a2, b: lineEnd(a2, b) };
      }

      const closed = chord < Math.max(18 * u, 0.28 * Math.max(w, h)) && len > 1.8 * Math.max(w, h);
      if (closed && w > 12 * u && h > 12 * u) {
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, rx = w / 2, ry = h / 2;
        let eErr = 0, rErr = 0;
        for (const p of pts) {
          const r = Math.hypot((p.x - cx) / rx, (p.y - cy) / ry);
          eErr += Math.abs(r - 1) * (rx + ry) / 2;
          rErr += Math.min(Math.abs(p.x - minX), Math.abs(p.x - maxX), Math.abs(p.y - minY), Math.abs(p.y - maxY));
        }
        eErr /= pts.length; rErr /= pts.length;
        const corners = simplify(pts, 0.09 * diag);
        const n = corners.length - (dist(corners[0], corners[corners.length - 1]) < 0.2 * diag ? 1 : 0);
        const angular = n >= 3 && cornerShare(pts, corners) > ANGULAR; // a polygon, not a rounded blob
        if (n === 3 && angular) return { type: 'polygon', pts: corners.slice(0, 3).map(snapPt) };
        if (rErr < eErr * 0.75 && rErr < 0.06 * diag) {
          const p0 = snapPt({ x: minX, y: minY }), p1 = snapPt({ x: maxX, y: maxY });
          return { type: 'rect', x: p0.x, y: p0.y, w: p1.x - p0.x, h: p1.y - p0.y };
        }
        // four corners, straight sides (a tilted square, a kite): a quadrilateral, not an ellipse
        if (n === 4 && angular) return { type: 'polygon', pts: corners.slice(0, 4).map(snapPt) };
        if (eErr < 0.09 * diag) {
          const c = style.grid ? gridSnap({ x: cx, y: cy }) : { x: cx, y: cy };
          const grid = v => style.grid ? Math.max(GRID / 2, Math.round(v / (GRID / 2)) * (GRID / 2)) : v;
          if (Math.abs(rx - ry) < 0.16 * Math.max(rx, ry)) return { type: 'circle', cx: c.x, cy: c.y, r: grid((rx + ry) / 2) };
          return { type: 'ellipse', cx: c.x, cy: c.y, rx: grid(rx), ry: grid(ry) };
        }
        return null;
      }

      // an open zig-zag of a few straight pieces: axes, angles, a "V"
      const corners = simplify(pts, Math.max(4 * u, 0.05 * diag));
      if (corners.length >= 3 && corners.length <= 4) {
        let fit = 0;
        for (const p of pts) {
          let best = Infinity;
          for (let i = 1; i < corners.length; i++) best = Math.min(best, segDist(p, corners[i - 1], corners[i]));
          fit = Math.max(fit, best);
        }
        // straight pieces meeting at corners — a curve held still is smoothed instead
        if (fit < Math.max(5 * u, 0.05 * diag) && cornerShare(pts, corners.slice(1, -1)) > ANGULAR)
          return { type: 'polyline', pts: corners.map(snapPt) };
      }
      return null;
    }

    function shapeElement(s) {
      const d = pts => pts.map((p, i) => (i ? 'L ' : 'M ') + r1(p.x) + ' ' + r1(p.y)).join(' ');
      switch (s.type) {
        case 'line': return el('path', { d: d([s.a, s.b]), style: styleText({ open: true }) });
        case 'polyline': return el('path', { d: d(s.pts), style: styleText({ open: true }) });
        case 'polygon': return el('path', { d: d(s.pts) + ' Z', style: styleText({ closed: true }) });
        case 'rect': return el('rect', {
          x: r1(Math.min(s.x, s.x + s.w)), y: r1(Math.min(s.y, s.y + s.h)),
          width: r1(Math.abs(s.w)), height: r1(Math.abs(s.h)), style: styleText({ closed: true })
        });
        case 'circle': return el('circle', { cx: r1(s.cx), cy: r1(s.cy), r: r1(s.r), style: styleText({ closed: true }) });
        case 'ellipse': return el('ellipse', { cx: r1(s.cx), cy: r1(s.cy), rx: r1(s.rx), ry: r1(s.ry), style: styleText({ closed: true }) });
      }
    }

    /* Freehand, made neat: the Pencil's wobble evened out, the flick it leaves
       as it lands or lifts cut off, corners kept sharp, and a loop closed
       without a seam. Then a smooth curve through what is left. */
    const STEP = 2; // the points, evenly spaced first, so all this works the same at any speed

    function resample(pts) {
      const out = [{ ...pts[0] }];
      let need = STEP;
      for (let i = 1; i < pts.length; i++) {
        let a = pts[i - 1], d = dist(a, pts[i]);
        while (d >= need) {
          const b = pts[i], t = need / d;
          a = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
          out.push(a);
          d = dist(a, b); need = STEP;
        }
        need -= d;
      }
      const last = pts[pts.length - 1];
      if (dist(out[out.length - 1], last) > 0.3) out.push({ ...last }); else out[out.length - 1] = { ...last };
      return out;
    }

    const turn = (a, b, c) => { // the angle between a→b and b→c
      const ux = b.x - a.x, uy = b.y - a.y, vx = c.x - b.x, vy = c.y - b.y;
      const n = Math.hypot(ux, uy) * Math.hypot(vx, vy);
      return n ? Math.acos(Math.max(-1, Math.min(1, (ux * vx + uy * vy) / n))) : 0;
    };

    // A flick: a short tail bending sharply away from where the stroke was
    // going — a tiny one (under 8 units), or anything before a corner in the
    // first or last 12 units, zigzags included
    function trimHooks(p, start) {
      if (pathLength(p) < 40 || p.length < 14) return p;
      for (let round = 0; round < 3 && p.length >= 14; round++) {
        const cs = cornersOf(p, false), last = p.length - 1;
        const head = start && cs.length && cs[0] <= 6 ? cs[0] : 0;
        const tail = cs.length && cs[cs.length - 1] >= last - 6 ? cs[cs.length - 1] : last;
        if (!head && tail === last) break;
        p = p.slice(head, tail + 1);
      }
      if (p.length < 14) return p;
      const hook = q => { // q: the stroke from the end being looked at inwards
        for (let n = 4; n >= 2; n--) if (turn(q[n + 8], q[n], q[0]) > 1.3) return n;
        return 0;
      };
      const end = hook(p.slice().reverse());
      if (end) p = p.slice(0, p.length - end);
      const begin = start ? hook(p) : 0;
      return begin ? p.slice(begin) : p;
    }

    // corners: where the stroke turns sharply over a few points — the sharpest of a run
    function cornersOf(raw, loop) {
      // looked for on a lightly smoothed copy, so the Pencil's jitter makes no corners
      const p = relax(raw, 1);
      const n = p.length, R = 3, at = i => p[loop ? (i + n) % n : i];
      const sharp = [];
      for (let i = loop ? 0 : R; i < (loop ? n : n - R); i++) {
        const a = turn(at(i - R), p[i], at(i + R));
        if (a > 0.95) sharp.push({ i, a });
      }
      const out = [];
      for (const c of sharp) {
        const prev = out[out.length - 1];
        if (prev && c.i - prev.i <= R) { if (c.a > prev.a) out[out.length - 1] = c; }
        else out.push(c);
      }
      return out.map(c => c.i);
    }

    // each point moves toward its neighbours, never across a corner; the ends stay put
    function relax(p, R) {
      return p.map((q, i) => {
        const r = Math.min(R, i, p.length - 1 - i);
        if (!r) return q;
        let x = 0, y = 0, w = 0;
        for (let k = -r; k <= r; k++) { const f = r + 1 - Math.abs(k); x += p[i + k].x * f; y += p[i + k].y * f; w += f; }
        return { x: x / w, y: y / w };
      });
    }

    // ends near each other around a real area: a loop (an overshoot past the start is cut)
    function loopOf(p) {
      if (p.length < 12) return null;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const q of p) { minX = Math.min(minX, q.x); maxX = Math.max(maxX, q.x); minY = Math.min(minY, q.y); maxY = Math.max(maxY, q.y); }
      if (maxX - minX < 12 || maxY - minY < 12) return null;
      let cut = p.length - 1;
      for (let i = Math.floor(p.length * 0.75); i < p.length; i++) if (dist(p[i], p[0]) < dist(p[cut], p[0])) cut = i;
      return dist(p[cut], p[0]) < 14 ? p.slice(0, cut + 1) : null;
    }

    // a freehand stroke as a path: a little smoothing, or with a hold, fully corrected
    function curveElement(pts, full) {
      const f = freehand(pts, !!pts[0].snapped, full);
      return el('path', { d: f.d, style: styleText(f.loop ? { closed: true } : { open: true }) });
    }

    function freehand(raw, startSnapped, full) {
      // all of it measured as it looks on screen: zoomed in, finer detail survives
      const k = zoom;
      let p = resample(raw.map(q => ({ x: q.x * k, y: q.y * k })));
      // How far the smoothing reaches. Drawn: only a little (±2–4 units), so
      // only the wobble of a curve goes — straight pieces and corners stay as
      // drawn. Held at the end: fully (up to ±18 units, twice over), fewer
      // points, a clean curve. Less for small strokes either way: a letter
      // written by hand keeps its shape.
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const q of p) { minX = Math.min(minX, q.x); maxX = Math.max(maxX, q.x); minY = Math.min(minY, q.y); maxY = Math.max(maxY, q.y); }
      const size = Math.max(maxX - minX, maxY - minY);
      // a letter: smoothed a touch, nothing else — its hooks and loops are meant
      const big = size >= WRITING;
      if (big) p = trimHooks(p, !startSnapped);
      const R = full ? (size < 50 ? 2 : size < 120 ? 5 : 9) : (size < 50 ? 1 : 2);
      const passes = full ? 2 : 1, eps = full ? 1.5 : 0.5;
      // with an arrow it stays open: a turning arrow keeps its head
      const loop = style.arrow || !big ? null : loopOf(p);
      if (loop) p = loop;
      else if (big) { // ends on another end: joins it
        const last = p[p.length - 1], end = endSnap({ x: last.x / k, y: last.y / k });
        if (end) p[p.length - 1] = { x: end.x * k, y: end.y * k };
      }
      const corners = cornersOf(p, !!loop);
      if (!loop) return { d: curve(relaxPieces(p, corners, R, passes), false, k, eps), loop: false };
      // a loop is smoothed all the way round: from a corner back to it…
      if (corners.length) {
        const c = corners[0];
        p = p.slice(c).concat(p.slice(0, c), [p[c]]);
        const out = relaxPieces(p, cornersOf(p, false), R, passes);
        out[0].corner = true; // (the same point as the last one)
        return { d: curve(out, true, k, eps), loop: true };
      }
      // …or, without one, three times round, keeping the middle
      const n = p.length;
      return { d: curve(relaxPieces(p.concat(p, p), [], R, passes).slice(n, 2 * n), true, k, eps), loop: true };
    }

    // smoothed piece by piece between corners, which stay exactly where they are
    function relaxPieces(p, corners, R, passes) {
      const cuts = [0, ...corners, p.length - 1];
      let out = [];
      for (let k = 0; k + 1 < cuts.length; k++) {
        let piece = p.slice(cuts[k], cuts[k + 1] + 1);
        for (let i = 0; i < passes; i++) piece = relax(piece, R);
        piece[piece.length - 1].corner = k + 1 < cuts.length - 1;
        out = out.concat(k ? piece.slice(1) : piece);
      }
      return out;
    }

    // a smooth curve through the points (Catmull–Rom), sharp at corners; a loop closes with Z.
    // The points are k times the page's units (the zoom), written back at the page's.
    function curve(pts, closed, k, eps) {
      const pieces = [[]];
      for (const q of pts) { pieces[pieces.length - 1].push(q); if (q.corner) pieces.push([q]); }
      let p = pieces.flatMap((piece, i) => (i ? simplify(piece, eps).slice(1) : simplify(piece, eps)));
      if (closed && p.length > 2 && dist(p[0], p[p.length - 1]) < 0.5) p = p.slice(0, -1);
      p = p.map(q => ({ x: q.x / k, y: q.y / k, corner: q.corner }));
      if (p.length < 3 && !closed) return 'M ' + r1(p[0].x) + ' ' + r1(p[0].y) + ' L ' + r1(p[p.length - 1].x) + ' ' + r1(p[p.length - 1].y);
      const n = p.length, at = i => closed ? p[(i + n) % n] : p[Math.max(0, Math.min(n - 1, i))];
      // the direction through each point (none at a corner); each piece's handles a third of
      // its own length, so long and short pieces next to each other join without a kink
      const direction = i => {
        if (at(i).corner) return { x: 0, y: 0 };
        const dx = at(i + 1).x - at(i - 1).x, dy = at(i + 1).y - at(i - 1).y, l = Math.hypot(dx, dy);
        return l ? { x: dx / l, y: dy / l } : { x: 0, y: 0 };
      };
      let d = 'M ' + r1(p[0].x) + ' ' + r1(p[0].y);
      for (let i = 0; i < (closed ? n : n - 1); i++) {
        const a = at(i), b = at(i + 1), ta = direction(i), tb = direction(i + 1), l = dist(a, b) / 3;
        d += ` C ${r1(a.x + ta.x * l)} ${r1(a.y + ta.y * l)} ${r1(b.x - tb.x * l)} ${r1(b.y - tb.y * l)} ${r1(b.x)} ${r1(b.y)}`;
      }
      return closed ? d + ' Z' : d;
    }

    /* ---------------------------------------------------------------- *
     *  the content, its history, and the file it becomes
     * ---------------------------------------------------------------- */
    const items = () => [...content.children];
    const snapshot = () => items().map(n => { const c = n.cloneNode(true); c.removeAttribute('data-editing'); return c; });
    function restore(snap) {
      content.replaceChildren(...snap.map(n => n.cloneNode(true)));
      // undo while a label is being retyped: it still replaces its old self
      if (label && label.replacing) {
        const was = label.replacing;
        const same = items().find(n => n.localName === 'text' && n.textContent === was.textContent &&
          n.getAttribute('x') === was.getAttribute('x') && n.getAttribute('y') === was.getAttribute('y'));
        if (same) { same.setAttribute('data-editing', ''); label.replacing = same; }
      }
    }
    function history() {
      let h = histories.get(target.key);
      if (!h) histories.set(target.key, h = { undo: [], redo: [], last: snapshot() });
      return h;
    }
    function paintHistory() {
      const h = target.key ? history() : { undo: [], redo: [] };
      $('#undo').disabled = !h.undo.length;
      $('#redo').disabled = !h.redo.length;
      send({ type: 'history', canUndo: !!h.undo.length, canRedo: !!h.redo.length });
    }

    // every finished action: one undo step, and the figure goes to the Mac
    function commit() {
      const h = history();
      h.undo.push(h.last);
      if (h.undo.length > 200) h.undo.shift();
      h.redo = [];
      h.last = snapshot();
      drawingChanged();
      paintHistory();
      paintLabels();
      publishSoon();
    }
    function undo() {
      const h = history();
      if (!h.undo.length) return;
      h.redo.push(h.last);
      h.last = h.undo.pop();
      restore(h.last);
      drawingChanged();
      select([]);
      paintHistory(); paintLabels(); publish();
    }
    function redo() {
      const h = history();
      if (!h.redo.length) return;
      h.undo.push(h.last);
      h.last = h.redo.pop();
      restore(h.last);
      drawingChanged();
      select([]);
      paintHistory(); paintLabels(); publish();
    }
    $('#undo').onclick = undo;
    $('#redo').onclick = redo;

    // While writing, the figure goes to the Mac once the Pencil rests a moment (or every
    // two seconds), not after every stroke: serializing and saving it each time made writing lag
    let publishTimer = 0, publishDue = 0;
    function publishSoon() {
      clearTimeout(publishTimer);
      if (!publishDue) publishDue = Date.now() + 2000;
      publishTimer = setTimeout(publish, Math.max(0, Math.min(400, publishDue - Date.now())));
    }
    function flushPublish() { if (publishDue) publish(); }
    window.addEventListener('pagehide', flushPublish);

    function publish() {
      clearTimeout(publishTimer);
      publishDue = 0;
      send({ type: 'change', key: target.key, svg: serialize(), empty: !content.children.length });
    }

    // Cropped to the height the drawing uses, always the full 1000 wide, so
    // left, middle and right stay where they were drawn on the page.
    function serialize() {
      let y0 = 0, h = 100;
      if (content.children.length) {
        const b = content.getBBox();
        const pad = 20; // room for stroke widths and arrow heads
        y0 = Math.floor(b.y - pad);
        h = Math.max(40, Math.ceil(b.height + 2 * pad));
      }
      const doc = document.implementation.createDocument(SVGNS, 'svg', null);
      const root = doc.documentElement;
      root.setAttribute('width', W);
      root.setAttribute('height', h);
      root.setAttribute('viewBox', `0 ${y0} ${W} ${h}`);
      const defs = doc.createElementNS(SVGNS, 'defs');
      // only the arrow heads and hatchings in use, so the file stays small
      const used = new Set([...content.querySelectorAll('[style*="url("]')].flatMap(n =>
        [...(n.getAttribute('style') || '').matchAll(/url\(#([\w-]+)\)/g)].map(m => m[1])));
      const tmp = document.createElementNS(SVGNS, 'defs');
      tmp.innerHTML = DEFS;
      for (const m of tmp.children) if (used.has(m.id)) defs.appendChild(doc.importNode(m, true));
      for (const d of extraDefs) if (!OUR_DEFS.has(d.id)) defs.appendChild(doc.importNode(d, true));
      const g = doc.createElementNS(SVGNS, 'g');
      g.setAttribute('id', 'figure');
      for (const n of items()) { g.appendChild(doc.createTextNode('\n')); g.appendChild(doc.importNode(n, true)); }
      for (const n of g.querySelectorAll('[data-math], [data-editing]')) { n.removeAttribute('data-math'); n.removeAttribute('data-editing'); }
      g.appendChild(doc.createTextNode('\n'));
      root.append(doc.createTextNode('\n'), defs, doc.createTextNode('\n'), g, doc.createTextNode('\n'));
      return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(doc) + '\n';
    }

    // A figure from disk. Ours come back as they went out; one that Inkscape
    // saved may have layers, other units or its own defs — every object
    // becomes something the eraser can take, at our scale.
    function load(svgText) {
      drawingChanged();
      content.replaceChildren();
      extraDefs = [];
      if (!svgText) return;
      const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
      const root = doc.documentElement;
      if (!root || root.localName !== 'svg') return;
      const vb = (root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
      const vw = vb.length === 4 && vb[2] > 0 ? vb[2] : parseFloat(root.getAttribute('width')) || W;
      const k = W / vw, ox = vb.length === 4 ? vb[0] : 0;
      const wrap = k !== 1 || ox !== 0 ? `matrix(${k},0,0,${k},${-ox * k},0)` : '';
      const SKIP = new Set(['defs', 'metadata', 'namedview', 'title', 'desc', 'style', 'script']);
      const take = (node, transform) => {
        for (const child of [...node.children]) {
          if (SKIP.has(child.localName)) {
            if (child.localName === 'defs') for (const d of child.children) if (!OUR_DEFS.has(d.id)) extraDefs.push(document.importNode(d, true));
            continue;
          }
          const layer = child.localName === 'g' && (child.getAttribute('id') === 'figure' ||
            child.getAttributeNS('http://www.inkscape.org/namespaces/inkscape', 'groupmode') === 'layer');
          const t = [transform, child.localName === 'g' && layer ? child.getAttribute('transform') : ''].filter(Boolean).join(' ');
          if (layer) { take(child, t); continue; }
          const node2 = document.importNode(child, true);
          if (transform) {
            const g = document.createElementNS(SVGNS, 'g');
            g.setAttribute('transform', transform);
            g.appendChild(node2);
            content.appendChild(g);
          } else content.appendChild(node2);
        }
      };
      take(root, wrap);
      // the old opaque gray fill becomes the see-through one: the same gray, until fills overlap
      for (const n of content.querySelectorAll('[style*="fill"]')) {
        const st = readStyle(n);
        if ((st.get('fill') || '').toLowerCase() !== GRAY || !isFilled(st) || st.has('fill-opacity')) continue;
        setFill(st, 1, '#000000');
        writeStyle(n, st);
      }
      const defs = view.querySelector('defs');
      defs.querySelectorAll('.extra').forEach(n => n.remove());
      for (const d of extraDefs) { const c = d.cloneNode(true); c.classList.add('extra'); defs.appendChild(c); }
    }

    /* ---------------------------------------------------------------- *
     *  the Pencil — one gesture at a time, whichever tool is in hand
     * ---------------------------------------------------------------- */
    let stroke = null, erasing = null, picking = null, axes = null, dragging = null, hold = 0;

    stage.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch' || e.button > 0) return; // fingers scroll
      e.preventDefault();
      if (target.kind === 'none' || !target.key) { flashVeil(); return; }
      stage.setPointerCapture(e.pointerId);
      const p = toPage(e);
      send({ type: 'activity' });
      const grab = labelAt(e.clientX, e.clientY);
      if (grab) { dragging = { id: e.pointerId, node: grab, x: e.clientX, y: e.clientY, last: p, moved: false }; return; }
      if (tool === 'text') { askText(p); return; }
      if (tool === 'erase') { erasing = { id: e.pointerId, gone: [] }; eraseAt(e.clientX, e.clientY); return; }
      if (tool === 'select') { startPick(e, p); return; }
      if (tool === 'axes') { const o = snapPt(p); axes = { id: e.pointerId, o, c: o }; showSnapMarks([o]); return; }
      // it starts where the Pencil came down; joining an end there waits until it is bigger than a letter
      stroke = {
        id: e.pointerId, pts: [p], snapped: null, anchor: p, big: false, join: null,
        box: { x0: p.x, y0: p.y, x1: p.x, y1: p.y }, d: 'M ' + r1(p.x) + ' ' + r1(p.y),
        path: el('path', { style: styleText() })
      };
      stroke.path.style.fill = 'none';
      live.appendChild(stroke.path);
      paintLive(e);
    });

    stage.addEventListener('pointermove', e => {
      // only the pointer that is pressed draws: a mouse hovering by adds nothing
      const active = stroke || erasing || picking || axes || dragging;
      if (!active || e.pointerId !== active.id || !(e.buttons & 1)) return;
      if (dragging) { moveDrag(e); return; }
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      if (erasing) {
        for (const ev of evs.length ? evs : [e]) eraseAt(ev.clientX, ev.clientY);
        return;
      }
      if (picking) { movePick(toPage(e)); return; }
      if (axes) { axes.c = style.grid ? gridSnap(toPage(e)) : toPage(e); paintAxes(); return; }
      for (const ev of evs.length ? evs : [e]) {
        const p = toPage(ev);
        if (stroke.snapped) {
          // a snapped line keeps following the Pencil, as in Notes
          if (stroke.snapped.type === 'line') {
            stroke.snapped.b = lineEnd(stroke.snapped.a, p);
            showSnapped();
            continue;
          }
          // a corrected curve: drawing on makes it freehand again (hold again to correct)
          if (stroke.snapped.type !== 'curve' || dist(p, stroke.heldAt) < 4 / zoom) continue;
          stroke.snapped = null;
          live.replaceChildren(stroke.path);
          showSnapMarks([]);
        }
        if (dist(p, stroke.pts[stroke.pts.length - 1]) < 0.6 / zoom) continue;
        stroke.pts.push(p);
        stroke.d += ' L ' + r1(p.x) + ' ' + r1(p.y);
        grow(stroke, p);
        if (dist(p, stroke.anchor) > 3.5 / zoom) { stroke.anchor = p; armHold(); }
      }
      if (!stroke.snapped) paintLive(e);
    });

    // Handwriting stays as written: only a stroke bigger than a letter (on screen) has its
    // ends joined to others, a flick cut off or a loop closed — that is for figures
    const WRITING = 60;
    const isBig = (w, h) => Math.max(w, h) * zoom >= WRITING;
    function grow(s, p) {
      const b = s.box;
      b.x0 = Math.min(b.x0, p.x); b.y0 = Math.min(b.y0, p.y); b.x1 = Math.max(b.x1, p.x); b.y1 = Math.max(b.y1, p.y);
      if (s.big || !isBig(b.x1 - b.x0, b.y1 - b.y0)) return;
      s.big = true;
      s.join = endSnap(s.pts[0]);
      if (s.join) showSnapMarks([s.join]);
    }
    // the points as they are finished: a big stroke starts at the end it joins
    const strokePts = s => s.join ? [s.join, ...s.pts.slice(1)] : s.pts;

    function armHold() {
      clearTimeout(hold);
      hold = setTimeout(() => {
        if (!stroke || stroke.snapped) return;
        // a shape it looks like — else, for a curve, the curve fully smoothed
        const s = recognize(stroke.pts) || (pathLength(stroke.pts) > 20 / zoom ? { type: 'curve' } : null);
        if (!s) return;
        stroke.snapped = s;
        stroke.heldAt = stroke.pts[stroke.pts.length - 1];
        showSnapped();
      }, HOLD_MS);
    }

    // the stroke so far, a piece added per move — and a little ahead of the Pencil, where
    // it is about to be, so the line keeps up with it (that guess is redrawn with every move)
    function paintLive(e) {
      let d = stroke.d;
      if (stroke.pts.length === 1) d += ' l 0.01 0';
      for (const ev of (e && e.getPredictedEvents ? e.getPredictedEvents() : [])) {
        const q = toPage(ev);
        d += ' L ' + r1(q.x) + ' ' + r1(q.y);
      }
      stroke.path.setAttribute('d', d);
    }

    function showSnapped() {
      if (stroke.snapped.type === 'curve') {
        live.replaceChildren(curveElement(strokePts(stroke), true));
        showSnapMarks([]);
        return;
      }
      live.replaceChildren(shapeElement(stroke.snapped));
      const s = stroke.snapped;
      showSnapMarks(s.type === 'line' ? [s.a, s.b] : s.pts || []);
    }

    function endStroke() {
      clearTimeout(hold);
      const s = stroke;
      stroke = null;
      live.replaceChildren();
      showSnapMarks([]);
      if (!s) return;
      let node;
      if (s.snapped && s.snapped.type === 'curve') node = curveElement(strokePts(s), true);
      else if (s.snapped) node = shapeElement(s.snapped);
      else if (pathLength(s.pts) < 3 / zoom) {
        // a tap is a point, the kind every geometry figure has
        const c = snapPt(s.pts[0]);
        node = el('circle', { cx: r1(c.x), cy: r1(c.y), r: style.thick ? 5 : 3.6, style: styleText({ dot: true }) });
      } else node = curveElement(strokePts(s), false);
      add(node);
      commit();
    }

    // filled shapes go underneath the lines, so a fill never hides one
    // …but above a locked picture, which stays at the very bottom
    function add(node) {
      if (isFilled(readStyle(node))) content.insertBefore(node, items().find(n => !isLocked(n)) || null);
      else content.appendChild(node);
    }

    /* ---------------------------------------------------------------- *
     *  axes: press at the origin, drag out — x and y with arrows and labels
     * ---------------------------------------------------------------- */
    function axesParts() {
      const { o, c } = axes;
      const dx = c.x - o.x, dy = c.y - o.y, sx = Math.sign(dx) || 1, sy = Math.sign(dy) || -1;
      const parts = [], tail = 18, color = style.color;
      const st = `fill:none;stroke:${color};stroke-width:${width()};stroke-linecap:round;stroke-linejoin:round;marker-end:url(#${markerId(color)})`;
      const label = (x, y) => el('text', { x: r1(x), y: r1(y), style: `font-size:${TEXT_SIZE}px;font-family:serif;fill:${color}` });
      if (Math.abs(dx) >= 30 / zoom) {
        parts.push(el('path', { d: `M ${r1(o.x - tail * sx)} ${r1(o.y)} L ${r1(c.x)} ${r1(o.y)}`, style: st }));
        const t = label(sx > 0 ? c.x + 10 : c.x - 28, o.y + TEXT_SIZE * 0.35); t.textContent = '$x$'; parts.push(t);
      }
      if (Math.abs(dy) >= 30 / zoom) {
        parts.push(el('path', { d: `M ${r1(o.x)} ${r1(o.y - tail * sy)} L ${r1(o.x)} ${r1(c.y)}`, style: st }));
        const t = label(o.x + 12, c.y + TEXT_SIZE * 0.35); t.textContent = '$y$'; parts.push(t);
      }
      return parts;
    }

    function paintAxes() { live.replaceChildren(...axesParts()); }

    function endAxes() {
      const parts = axesParts();
      axes = null;
      live.replaceChildren();
      showSnapMarks([]);
      if (!parts.length) return;
      for (const n of parts) content.appendChild(n);
      commit();
      setTool('pen'); // one set of axes, then straight back to drawing
    }

    /* ---------------------------------------------------------------- *
     *  eraser: whatever the Pencil passes over goes, whole
     * ---------------------------------------------------------------- */
    const OFFSETS = [[0, 0], [6, 0], [-6, 0], [0, 6], [0, -6], [4, 4], [-4, -4], [4, -4], [-4, 4]];
    function hits(node, cx, cy) {
      if (node instanceof SVGGeometryElement) {
        const m = node.getScreenCTM();
        if (!m) return false;
        const inv = m.inverse();
        const cs = getComputedStyle(node);
        const filled = cs.fill && cs.fill !== 'none';
        for (const [dx, dy] of OFFSETS) {
          const pt = new DOMPoint(cx + dx, cy + dy).matrixTransform(inv);
          if (node.isPointInStroke(pt) || (filled && node.isPointInFill(pt))) return true;
        }
        return false;
      }
      if (node instanceof SVGTextElement) {
        // a typeset label is where KaTeX drew it, not where its $…$ source would be
        const r = (node._span && node._span.isConnected ? node._span : node).getBoundingClientRect();
        return cx >= r.left - 4 && cx <= r.right + 4 && cy >= r.top - 4 && cy <= r.bottom + 4;
      }
      return [...node.children].some(c => hits(c, cx, cy));
    }

    function eraseAt(cx, cy) {
      for (const node of items().reverse().filter(n => !isLocked(n))) {
        if (hits(node, cx, cy)) { node.remove(); erasing.gone.push(node); }
      }
    }

    function endErase() {
      const done = erasing;
      erasing = null;
      if (done && done.gone.length) commit();
    }

    /* ---------------------------------------------------------------- *
     *  select: tap a stroke or draw around several, then drag them
     * ---------------------------------------------------------------- */
    function selectionBox() {
      if (!selection.length) return null;
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const n of selection) {
        const b = pageBox(n);
        x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
      }
      const m = 8 / zoom; // a margin that looks the same at any zoom
      return { x: x0 - m, y: y0 - m, w: x1 - x0 + 2 * m, h: y1 - y0 + 2 * m };
    }

    function select(list) {
      selection = list.filter(n => n.isConnected);
      paintSelection();
    }

    function paintSelection() {
      ui.querySelectorAll('.sel-box, .handle, .handle-guide').forEach(n => n.remove());
      const menu = $('#selmenu');
      const box = selectionBox();
      menu.classList.toggle('hidden', !box || !!picking);
      if (!box) return;
      ui.appendChild(el('rect', { class: 'sel-box', x: box.x, y: box.y, width: box.w, height: box.h, rx: 6 / zoom }));
      paintHandles();
      if (picking) return;
      const top = pageToClient({ x: box.x + box.w / 2, y: box.y });
      const bottom = pageToClient({ x: box.x + box.w / 2, y: box.y + box.h });
      const below = top.y < stage.getBoundingClientRect().top + 60;
      menu.style.left = Math.max(90, Math.min(innerWidth - 90, top.x)) + 'px';
      menu.style.top = (below ? bottom.y + 56 : top.y - 8) + 'px';
    }

    /* Handles: one shape selected, the points that make it, to drag — a
       circle's centre and a point on it (drag that onto a point and the
       circle goes through it), an ellipse's centre and its two radii, a
       rectangle's corners, the corners of a line, polyline or polygon.
       They snap to other points and the grid like the ends of strokes. */
    const num = (n, a) => +n.getAttribute(a);

    // a path of straight pieces only, as our lines and polygons are: its corners
    function polyPoints(n) {
      const d = n.getAttribute('d') || '';
      if (!/^\s*M[^A-Za-z]*(L[^A-Za-z]*)*(Z\s*)?$/.test(d)) return null;
      const v = d.match(/-?\d*\.?\d+(?:e-?\d+)?/g).map(Number), pts = [];
      for (let i = 0; i + 1 < v.length; i += 2) pts.push({ x: v[i], y: v[i + 1] });
      return pts.length >= 2 ? { pts, closed: /Z\s*$/.test(d) } : null;
    }

    function handlesOf(n) {
      if (!n || n.hasAttribute('transform') || isLocked(n)) return [];
      switch (n.localName) {
        case 'circle': {
          if (readStyle(n).get('stroke') === 'none') return []; // a point: it moves as a whole
          const cx = num(n, 'cx'), cy = num(n, 'cy'), r = num(n, 'r'), a = n._handleAngle || 0;
          return [{ k: 'center', x: cx, y: cy }, { k: 'radius', x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }];
        }
        case 'ellipse': {
          const cx = num(n, 'cx'), cy = num(n, 'cy');
          return [{ k: 'center', x: cx, y: cy }, { k: 'rx', x: cx + num(n, 'rx'), y: cy }, { k: 'ry', x: cx, y: cy - num(n, 'ry') }];
        }
        case 'rect': {
          const x = num(n, 'x'), y = num(n, 'y'), w = num(n, 'width'), h = num(n, 'height');
          return [{ k: 0, x, y }, { k: 1, x: x + w, y }, { k: 2, x: x + w, y: y + h }, { k: 3, x, y: y + h }];
        }
        case 'path': {
          const poly = polyPoints(n);
          return poly ? poly.pts.map((q, i) => ({ k: i, x: q.x, y: q.y })) : [];
        }
      }
      return [];
    }

    function paintHandles() {
      if (selection.length !== 1 || (picking && picking.mode === 'move')) return;
      const n = selection[0], hs = handlesOf(n);
      if (n.localName === 'circle' && hs.length) // the radius, from the centre to the point on the circle
        ui.appendChild(el('path', { class: 'handle-guide', d: `M ${hs[0].x} ${hs[0].y} L ${hs[1].x} ${hs[1].y}` }));
      for (const h of hs) ui.appendChild(el('circle', { class: 'handle' + (h.k === 'center' ? ' center' : ''), cx: h.x, cy: h.y, r: 7 / zoom }));
    }

    // the handle under the Pencil (a generous 24 px), if any
    function handleAt(cx, cy) {
      if (selection.length !== 1) return null;
      let best = null, bd = 24;
      for (const h of handlesOf(selection[0])) {
        const c = pageToClient(h), d = Math.hypot(c.x - cx, c.y - cy);
        if (d < bd) { bd = d; best = h; }
      }
      return best;
    }

    function setHandle(n, h, p, fixed) {
      switch (n.localName) {
        case 'circle':
          if (h.k === 'center') { n.setAttribute('cx', r1(p.x)); n.setAttribute('cy', r1(p.y)); break; }
          n.setAttribute('r', r1(Math.max(1, dist(p, { x: num(n, 'cx'), y: num(n, 'cy') }))));
          n._handleAngle = Math.atan2(p.y - num(n, 'cy'), p.x - num(n, 'cx'));
          break;
        case 'ellipse':
          if (h.k === 'center') { n.setAttribute('cx', r1(p.x)); n.setAttribute('cy', r1(p.y)); }
          else if (h.k === 'rx') n.setAttribute('rx', r1(Math.max(1, Math.abs(p.x - num(n, 'cx')))));
          else n.setAttribute('ry', r1(Math.max(1, Math.abs(p.y - num(n, 'cy')))));
          break;
        case 'rect': // the opposite corner stays where it is
          n.setAttribute('x', r1(Math.min(p.x, fixed.x))); n.setAttribute('y', r1(Math.min(p.y, fixed.y)));
          n.setAttribute('width', r1(Math.max(1, Math.abs(p.x - fixed.x)))); n.setAttribute('height', r1(Math.max(1, Math.abs(p.y - fixed.y))));
          break;
        case 'path': {
          const poly = polyPoints(n);
          poly.pts[h.k] = p;
          n.setAttribute('d', poly.pts.map((q, i) => (i ? 'L ' : 'M ') + r1(q.x) + ' ' + r1(q.y)).join(' ') + (poly.closed ? ' Z' : ''));
          break;
        }
      }
    }

    function startHandle(e, h) {
      const n = selection[0];
      const fixed = n.localName === 'rect' ? handlesOf(n)[(h.k + 2) % 4] : null;
      picking = { id: e.pointerId, mode: 'handle', node: n, h, fixed, snaps: snapTargets(n), moved: false };
      paintSelection();
    }

    function moveHandle(p) {
      const { node, h, fixed, snaps } = picking;
      // onto another shape's point, else the grid when it is on
      let best = null, d = SNAP / zoom;
      for (const q of snaps) { const e = dist(p, q); if (e < d) { d = e; best = q; } }
      const at = best ? { x: best.x, y: best.y, snapped: true } : style.grid ? gridSnap(p) : p;
      setHandle(node, h, at, fixed);
      picking.moved = true;
      showSnapMarks([at]);
      paintSelection();
    }

    function startPick(e, p) {
      const grip = handleAt(e.clientX, e.clientY);
      if (grip) { startHandle(e, grip); return; }
      const box = selectionBox();
      const inside = box && p.x >= box.x && p.x <= box.x + box.w && p.y >= box.y && p.y <= box.y + box.h;
      if (!inside) {
        const hit = items().reverse().find(n => !isLocked(n) && hits(n, e.clientX, e.clientY));
        select(hit ? [hit] : []);
      }
      picking = selection.length
        ? { id: e.pointerId, mode: 'move', last: p, moved: false }
        : { id: e.pointerId, mode: 'lasso', pts: [p], path: el('path', { class: 'lasso' }) };
      if (picking.mode === 'lasso') ui.appendChild(picking.path);
      paintSelection();
    }

    function movePick(p) {
      if (picking.mode === 'handle') { moveHandle(p); return; }
      if (picking.mode === 'move') {
        const dx = p.x - picking.last.x, dy = p.y - picking.last.y;
        if (!dx && !dy) return;
        for (const n of selection) translate(n, dx, dy);
        picking.last = p; picking.moved = true;
        paintSelection(); paintLabels();
      } else {
        picking.pts.push(p);
        picking.path.setAttribute('d', picking.pts.map((q, i) => (i ? 'L' : 'M') + r1(q.x) + ' ' + r1(q.y)).join(' ') + ' Z');
      }
    }

    function endPick() {
      const done = picking;
      picking = null;
      if (done.mode === 'handle') { showSnapMarks([]); if (done.moved) commit(); paintSelection(); return; }
      if (done.mode === 'move') { if (done.moved) commit(); paintSelection(); return; }
      done.path.remove();
      if (pathLength(done.pts) < 12 / zoom) { select([]); return; }
      // everything whose middle lies inside the loop
      const inside = (p, poly) => {
        let c = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++)
          if ((poly[i].y > p.y) !== (poly[j].y > p.y) &&
            p.x < (poly[j].x - poly[i].x) * (p.y - poly[i].y) / (poly[j].y - poly[i].y) + poly[i].x) c = !c;
        return c;
      };
      select(items().filter(n => {
        if (isLocked(n)) return false;
        const b = pageBox(n);
        return inside({ x: b.x + b.w / 2, y: b.y + b.h / 2 }, done.pts);
      }));
    }

    // Move one item. Ours change their own coordinates, so the file stays
    // plain and labels keep their $…$ typesetting; anything else gets a
    // translate().
    function translate(n, dx, dy) {
      const shift = (name, d) => { if (n.hasAttribute(name)) n.setAttribute(name, r1(+n.getAttribute(name) + d)); };
      const t = n.getAttribute('transform');
      const d = n.getAttribute('d');
      if (!t && n.localName === 'text') {
        shift('x', dx); shift('y', dy);
        for (const s of n.querySelectorAll('tspan[x]')) s.setAttribute('x', r1(+s.getAttribute('x') + dx));
        for (const s of n.querySelectorAll('tspan[y]')) s.setAttribute('y', r1(+s.getAttribute('y') + dy));
      } else if (!t && (n.localName === 'circle' || n.localName === 'ellipse')) { shift('cx', dx); shift('cy', dy); }
      else if (!t && n.localName === 'rect') { shift('x', dx); shift('y', dy); }
      else if (!t && n.localName === 'path' && /^[MLCQZ\d\s.,-]+$/.test(d || '')) {
        let i = 0;
        n.setAttribute('d', d.replace(/-?\d*\.?\d+/g, v => r1(+v + (i++ % 2 ? dy : dx))));
      } else {
        const m = /^translate\(\s*(-?[\d.]+)[\s,]+(-?[\d.]+)\s*\)(.*)$/.exec(t || '');
        n.setAttribute('transform', m ? `translate(${r1(+m[1] + dx)},${r1(+m[2] + dy)})${m[3]}`
          : `translate(${r1(dx)},${r1(dy)})` + (t ? ' ' + t : ''));
      }
    }

    $('#sel-del').onclick = () => {
      if (!selection.length) return;
      selection.forEach(n => n.remove());
      select([]);
      commit();
    };
    $('#sel-dup').onclick = () => {
      if (!selection.length) return;
      const copies = selection.map(n => n.cloneNode(true));
      for (const c of copies) { translate(c, 25, 25); add(c); }
      select(copies);
      commit();
    };
    for (const id of ['#sel-del', '#sel-dup']) $(id).addEventListener('pointerdown', e => e.stopPropagation());

    // A style button with something selected changes the selection too
    function restyle(n, key) {
      if (n.localName === 'g') { for (const c of n.children) restyle(c, key); return; }
      const st = readStyle(n);
      const isText = n.localName === 'text';
      const isDot = n.localName === 'circle' && st.get('stroke') === 'none';
      // closed: a shape, a path ending in Z, or one whose ends meet (freehand loops of older figures)
      const meets = () => {
        try { const l = n.getTotalLength(); return l > 30 && dist(n.getPointAtLength(0), n.getPointAtLength(l)) < 14; }
        catch { return false; }
      };
      const closed = ['rect', 'circle', 'ellipse', 'polygon'].includes(n.localName) || /z\s*$/i.test(n.getAttribute('d') || '') ||
        (n.localName === 'path' && meets());
      const w = parseFloat(st.get('stroke-width')) || 2.5;
      const arrows = () => {
        const c = st.get('stroke') || style.color;
        st.delete('marker-end'); st.delete('marker-start');
        if (style.arrow) st.set('marker-end', `url(#${markerId(c)})`);
        if (style.arrow === 2) st.set('marker-start', `url(#${markerId(c, true)})`);
      };
      switch (key) {
        case 'color':
          if (isText || isDot) { st.set('fill', style.color); break; }
          st.set('stroke', style.color);
          if (isFilled(st)) setFill(st, fillKind(st), style.color); // the fill is the shape's colour too
          for (const k of ['marker-end', 'marker-start'])
            if (st.has(k)) st.set(k, `url(#${markerId(style.color, k === 'marker-start')})`);
          break;
        case 'thick': {
          if (isText) break;
          if (isDot) { n.setAttribute('r', style.thick ? 5 : 3.6); break; }
          const nw = width();
          st.set('stroke-width', nw);
          const dash = st.get('stroke-dasharray');
          if (dash && dash !== 'none') st.set('stroke-dasharray', dash.startsWith('0.01') ? `0.01,${2.6 * nw}` : `${4 * nw},${3 * nw}`);
          break;
        }
        case 'dashed': case 'dotted': {
          if (isText || isDot) break;
          const dash = dashFor(w);
          if (dash) st.set('stroke-dasharray', dash); else st.delete('stroke-dasharray');
          break;
        }
        case 'arrow': if (!isText && !isDot && !closed) arrows(); break;
        case 'fill': if (!isText && !isDot && closed) setFill(st, style.fill, st.get('stroke') || style.color); break;
      }
      writeStyle(n, st);
      if (key === 'fill' && style.fill && n.parentNode === content) content.insertBefore(n, items().find(c => !isLocked(c) && c !== n) || null);
    }

    function restyleSelection(key) {
      if (!selection.length || key === 'grid') return;
      for (const n of selection) restyle(n, key);
      paintSelection();
      commit();
    }

    /* ---------------------------------------------------------------- *
     *  labels: tap the spot, type on the Mac (snippets included)
     * ---------------------------------------------------------------- */
    let label = null; // { node, caret, replacing, span (its typeset overlay), frame }

    function askText(p) {
      cancelText();
      // tapping an existing label edits it: it makes way for the copy being typed
      const c = pageToClient(p);
      const hit = items().reverse().find(n => n instanceof SVGTextElement && hits(n, c.x, c.y));
      const replacing = hit || null;
      const at = replacing ? { x: +replacing.getAttribute('x'), y: +replacing.getAttribute('y') } : { x: p.x, y: p.y + TEXT_SIZE * 0.35 };
      if (replacing) replacing.setAttribute('data-editing', '');
      const node = el('text', {
        x: r1(at.x), y: r1(at.y),
        style: `font-size:${TEXT_SIZE}px;font-family:serif;fill:${replacing ? (readStyle(replacing).get('fill') || style.color) : style.color}`
      });
      node.textContent = replacing ? replacing.textContent : '';
      const caret = el('rect', { id: 'caret', x: r1(at.x), y: r1(at.y - TEXT_SIZE * 0.8), width: 2.5, height: TEXT_SIZE });
      typingLayer.append(node, caret);
      label = { node, caret, replacing, span: null, frame: 0 };
      paintLabels();
      send({ type: 'text-request', text: node.textContent });
      setTool('pen'); // one label at a time, then straight back to drawing
    }

    // The caret after the last letter: of the typeset label, or of the SVG text
    function placeCaret() {
      const { node, caret, span } = label;
      const x = span ? clientToPage(span.getBoundingClientRect().right, 0).x
        : +node.getAttribute('x') + (node.textContent ? node.getComputedTextLength() : 0);
      caret.setAttribute('x', r1(x + 2));
      caret.setAttribute('y', r1(+node.getAttribute('y') - TEXT_SIZE * 0.8));
      // typing shows it steady; it blinks again once the keys stop
      caret.style.animation = 'none';
      void caret.getBBox();
      caret.style.animation = '';
    }

    // Every key on the Mac sends the whole label; only the newest gets
    // painted, once per frame, so a fast typist never waits on the pad
    function previewText(text) {
      if (!label) return;
      label.text = text;
      if (label.frame) return;
      label.frame = requestAnimationFrame(() => {
        if (!label) return;
        label.frame = 0;
        if (label.node.textContent === label.text) return;
        label.node.textContent = label.text;
        paintLabels();
      });
    }

    function commitText(text) {
      if (!label) return;
      const { node, replacing } = label;
      cancelAnimationFrame(label.frame);
      label.caret.remove();
      label = null;
      // an undo meanwhile may have taken the old label away: the new one still lands
      const old = replacing && replacing.isConnected ? replacing : null;
      if (!text.trim()) {
        node.remove();
        if (old) { old.remove(); commit(); } else paintLabels();
        return;
      }
      node.textContent = text;
      if (old) old.replaceWith(node); else content.appendChild(node);
      commit();
    }

    function cancelText() {
      if (!label) return;
      cancelAnimationFrame(label.frame);
      label.node.remove(); label.caret.remove();
      if (label.replacing) label.replacing.removeAttribute('data-editing');
      label = null;
      paintLabels();
    }

    /* Moving a label: the one being typed goes wherever the Pencil drags it,
       whichever tool is in hand; a placed one with Text (or Select). With
       Text a tap still edits — only a drag moves. */
    const isTyping = n => !!label && n === label.node;
    function labelAt(cx, cy) {
